; Autoterm heater controller demo for ESP32-2432S028 ("Cheap Yellow Display")
; 2.8" ILI9341 320x240 + XPT2046 resistive touch
;
; Two versions that differ only in the screensaver logo:
;   pio run -e kolex -t upload       (default)
;   pio run -e beneteau -t upload
;
; Over-the-air updates: raise FW_VERSION, then run tools\publish_update.ps1.
; The screens download from UPDATE_BASE_URL (a secret GitHub Gist).

[platformio]
default_envs = kolex

[env:kolex]
build_flags = ${env.build_flags} -D SCREENSAVER_KOLEX=1 -D FW_VARIANT=\"kolex\"

[env:beneteau]
build_flags = ${env.build_flags} -D SCREENSAVER_BENETEAU=1 -D FW_VARIANT=\"beneteau\"

; settings shared by both versions
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; two 1.9 MB program slots: one running, one to download updates into
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    paulstoffregen/OneWire@2.3.8
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git#3.9.0
    tzapu/WiFiManager@2.0.17

; TFT_eSPI is configured here instead of editing its User_Setup.h
build_flags =
    -D FW_VERSION=2
    -D UPDATE_BASE_URL=\"https://gist.githubusercontent.com/gbr1088-ship-it/ba27fb18aa7b7034e1fd2db4760486bf/raw/\"
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1     ; if colours/image look wrong try ILI9341_DRIVER or ST7789_DRIVER
    -D TFT_INVERSION_ON=1     ; this board's panel shows a negative image without it
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1        ; display on HSPI, leaves VSPI free for the touch controller
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1  ; touch is handled by XPT2046_Touchscreen, not TFT_eSPI
