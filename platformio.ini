; Autoterm heater controller demo for ESP32-2432S028 ("Cheap Yellow Display")
; 2.8" ILI9341 320x240 + XPT2046 resistive touch
;
; Three versions that differ only in the screensaver logo:
;   pio run -e avl -t upload         (default, Adventure Van Life)
;   pio run -e kolex -t upload
;   pio run -e beneteau -t upload
;
; and the same Adventure Van Life version for the 7" Waveshare
; ESP32-S3-Touch-LCD-7 (800x480 RGB panel, GT911 touch), see src/display7.h:
;   pio run -e avl7 -t upload
;
; Over-the-air updates: raise FW_VERSION, then run tools\publish_update.ps1.
; The screens download from UPDATE_BASE_URL (a secret GitHub Gist).

[platformio]
default_envs = avl

[env:avl]
build_flags = ${env.build_flags} -D SCREENSAVER_AVL=1 -D FW_VARIANT=\"avl\"

[env:kolex]
build_flags = ${env.build_flags} -D SCREENSAVER_KOLEX=1 -D FW_VARIANT=\"kolex\"

[env:beneteau]
build_flags = ${env.build_flags} -D SCREENSAVER_BENETEAU=1 -D FW_VARIANT=\"beneteau\"

; 7" board: ESP32-S3 with 8 MB flash and 8 MB octal PSRAM (N8R8). The
; screen's frame buffer lives in the PSRAM, so it has to be enabled.
[env:avl7]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D BOARD_7INCH=1
    -D BOARD_HAS_PSRAM=1
    -D SCREENSAVER_AVL=1
    -D FW_VARIANT=\"avl7\"
    ; TFT_eSPI only draws into memory here; these pins are never driven
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12            ; the SD slot's pins; its CS stays off on the IO expander
    -D TFT_CS=-1
    -D TFT_DC=-1
    -D TFT_RST=-1
    -D SPI_FREQUENCY=20000000
    ${common.font_flags}

; settings shared by every version
[common]
lib_deps =
    paulstoffregen/OneWire@2.3.8
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git#3.9.0
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.4.1
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -D FW_VERSION=3
    -D UPDATE_BASE_URL=\"https://gist.githubusercontent.com/gbr1088-ship-it/ba27fb18aa7b7034e1fd2db4760486bf/raw/\"
font_flags =
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1

; the CYD versions (avl, kolex, beneteau)
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; two 1.9 MB program slots: one running, one to download updates into
board_build.partitions = min_spiffs.csv

lib_deps =
    ${common.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; TFT_eSPI is configured here instead of editing its User_Setup.h
build_flags =
    ${common.build_flags}
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1     ; if colours/image look wrong try ILI9341_DRIVER or ST7789_DRIVER
    -D TFT_INVERSION_ON=1     ; this board's panel shows a negative image without it
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1        ; display on HSPI, leaves VSPI free for the touch controller
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ${common.font_flags}  ; touch is handled by XPT2046_Touchscreen, not TFT_eSPI
